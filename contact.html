<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - ethic</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
  </head>
  <style>
    body {
      background-color: #f5eddc;
      background-image: linear-gradient(
          to right,
          rgba(9, 9, 9, 0.05) 1px,
          transparent 1px
        ),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.08) 1px, transparent 1px);
      background-size: 40px 40px;
    }
  </style>
  <body class="contact-page">
    <div id="particle-cursor"></div>
    <div class="cursor"></div>
    <div class="page1">
      <div class="navbar">
        <div class="navbar-left">
          <h1>ethic</h1>
        </div>
        <div class="navbar-right">
          <h2><a href="index.html">Home</a></h2>
          <h2><a href="about.html">About</a></h2>
          <h2><a href="projects.html">Projects</a></h2>
          <h2><a href="contact.html">Contact</a></h2>
          <i class="ri-menu-3-fill" id="menu-toggle">Menu</i>
        </div>
      </div>
      <section class="contact-section">
        <div class="contact-container">
          <h1>Get in touch</h1>
          <p>Have a question or want to work together? Send me a message.</p>
          <form id="contact-form" class="contact-form">
            <div class="form-row">
              <label for="name">Name</label>
              <input
                type="text"
                id="name"
                name="name"
                placeholder="Your name"
                required
              />
            </div>
            <div class="form-row">
              <label for="email">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                required
              />
            </div>
            <div class="form-row">
              <label for="message">Message</label>
              <textarea
                id="message"
                name="message"
                rows="6"
                placeholder="Write your message..."
                required
              ></textarea>
            </div>
            <button type="submit" class="contact-submit">Send Message</button>
          </form>
        </div>
      </section>

      <div class="footer">
        <div class="footer-left">
          <h1>Let's Collaborate</h1>
          <h3>© ethical_khoriya</h3>
        </div>
        <div class="footer-right">
          <div class="gmail">
            <h2>ethicalkhoriya@gmail.com</h2>
          </div>
          <div class="footer-link">
            <a href="https://github.com/naitikhoriya1" target="_blank"
              >Github <i class="ri-github-fill"></i
            ></a>
            <a
              href="https://www.linkedin.com/in/naitik-khoriya-4962a9229/"
              target="_blank"
              >LinkedIn <i class="ri-linkedin-fill"></i
            ></a>
            <a href="https://www.instagram.com/ethical_khoriya/" target="_blank"
              >Instagram <i class="ri-instagram-fill"></i
            ></a>
          </div>
        </div>
      </div>

      <div class="menu-overlay" id="menu-overlay">
        <button class="menu-close" id="menu-close" aria-label="Close menu">
          &times;
        </button>
        <nav class="menu-nav">
          <ul>
            <li><a href="index.html" class="menu-link">Home</a></li>
            <li><a href="about.html" class="menu-link">About</a></li>
            <li><a href="projects.html" class="menu-link">Projects</a></li>
            <li><a href="contact.html" class="menu-link">Contact</a></li>
          </ul>
        </nav>
        <div id="imgs">
          <img src="./MyImg/scroll1.jpg" alt="" />
          <img src="./MyImg/scroll2.jpg" alt="" />
          <img src="./MyImg/scroll3.jpg" alt="" />
          <img src="./MyImg/scroll4.jpg" alt="" />
          <img src="./MyImg/scroll5.jpg" alt="" />
          <img src="./MyImg/scroll6.jpg" alt="" />

          <img src="./MyImg/scroll8.jpeg" alt="" />
          <img src="./MyImg/scroll9.jpeg" alt="" />
          <img src="./MyImg/scroll10.jpeg" alt="" />
        </div>
      </div>
    </div>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
      integrity="sha512-7eHRwcbYkK4d9g/6tD/mhkf++eoTHwpNM9woBxtPUBWm67zeAfFC+HrdoE2GanKeocly/VxeLvIqwvCdk7qScg=="
      crossorigin="anonymous"

      crossorigin="anonymous"

    ></script>
    <script src="script.js"></script>
  </body>
